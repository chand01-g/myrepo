apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster1-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chand01-g/myargo-platform.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

