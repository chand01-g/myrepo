name: CI → CD (Docker Hub → Argo CD)

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/cicd.yaml"
  workflow_dispatch:

permissions:
  contents: write    # to commit the tag bump back to the repo

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/webapp
      TAG: v${{ github.run_number }}
      NEW_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/webapp:v${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tag in k8s manifest
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/webapp/deploy.yaml
          echo "Updated image to $NEW_IMAGE"

      - name: Commit & push manifest bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/webapp/deploy.yaml
          git commit -m "CD: deploy $NEW_IMAGE"
          git push

