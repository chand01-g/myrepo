apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web
  labels: { app: webapp }
spec:
  replicas: 1
  selector: { matchLabels: { app: webapp } }
  template:
    metadata: { labels: { app: webapp } }
    spec:
      containers:
        - name: webapp
          image: docker.io/<DOCKERHUB_USERNAME>/webapp:0.0.1   # will be auto-bumped
          ports: [{ containerPort: 8080 }]

